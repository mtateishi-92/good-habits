<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
  :root{
    --bg:#0d1526; --surface:#16233d; --surface2:#1f3357;
    --border:rgba(255,255,255,0.09); --gold:#c9a24b; --gold-bright:#e8c874;
    --text:#f5f1e6; --text-dim:#94a2ba; --flame:#e8834b;
    --l1:rgba(201,162,75,0.28); --l2:rgba(201,162,75,0.5); --l3:rgba(201,162,75,0.74);
  }
  body{margin:0;background:var(--bg);font-family:'Zen Kaku Gothic New',sans-serif;color:var(--text);}
  .serif{font-family:'Shippori Mincho',serif;}
  .frame{width:390px;height:844px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:var(--bg);}
  .content{flex:1;overflow:hidden;padding:52px 20px 0;display:flex;flex-direction:column;gap:20px;}
  .htitle{font-size:19px;font-weight:800;}
  .monthrow{display:flex;align-items:center;justify-content:space-between;}
  .monthlabel{font-size:15px;font-weight:700;}
  .chev{width:28px;height:28px;border-radius:8px;background:var(--surface);display:flex;align-items:center;justify-content:center;}
  .chev svg{width:14px;height:14px;color:var(--text-dim);}
  .cal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;}
  .weekrow{display:grid;grid-template-columns:repeat(7, minmax(0,1fr));gap:6px;}
  .weekrow div{text-align:center;font-size:10px;color:var(--text-dim);font-weight:700;}
  .daygrid{display:grid;grid-template-columns:repeat(7, minmax(0,1fr));gap:6px;}
  .day{aspect-ratio:1;border-radius:6px;background:var(--surface2);position:relative;}
  .day span{position:absolute;top:3px;left:5px;font-size:8px;color:var(--text-dim);}
  .day.blank{background:transparent;}
  .day.l1{background:var(--l1);}
  .day.l2{background:var(--l2);}
  .day.l3{background:var(--l3);}
  .day.l4{background:var(--gold);}
  .day.l4 span, .day.l3 span{color:var(--bg);}
  .day.today{box-shadow:0 0 0 2px var(--gold-bright);}
  .legend{display:flex;align-items:center;gap:6px;justify-content:flex-end;font-size:10px;color:var(--text-dim);}
  .legend .sw{width:11px;height:11px;border-radius:3px;}
  .stats{display:flex;gap:12px;}
  .stat{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;}
  .statval{font-size:19px;font-weight:800;color:var(--gold-bright);display:flex;align-items:center;gap:5px;}
  .statval svg{width:16px;height:16px;color:var(--flame);}
  .statlabel{font-size:10.5px;color:var(--text-dim);}
  .navbar{height:76px;flex:none;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;margin-top:auto;}
  .navitem{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text-dim);font-size:10px;}
  .navitem svg{width:20px;height:20px;}
  .navitem.active{color:var(--gold);}
</style>
</helmet>
<div class="frame">
  <div class="content">
    <div class="htitle serif">達成カレンダー</div>
    <div class="monthrow">
      <div class="chev"><svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="monthlabel">2026年9月</div>
      <div class="chev"><svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </div>
    <div class="cal">
      <div class="weekrow"><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div><div>日</div></div>
      <div class="daygrid">
        <div class="day blank"></div>
        <div class="day l2"><span>1</span></div>
        <div class="day l3"><span>2</span></div>
        <div class="day l1"><span>3</span></div>
        <div class="day l4"><span>4</span></div>
        <div class="day l3 today"><span>5</span></div>
        <div class="day"><span>6</span></div>
        <div class="day l2"><span>7</span></div>
        <div class="day l3"><span>8</span></div>
        <div class="day l4"><span>9</span></div>
        <div class="day l2"><span>10</span></div>
        <div class="day l1"><span>11</span></div>
        <div class="day"><span>12</span></div>
        <div class="day l3"><span>13</span></div>
        <div class="day l4"><span>14</span></div>
        <div class="day l3"><span>15</span></div>
        <div class="day l2"><span>16</span></div>
        <div class="day l1"><span>17</span></div>
        <div class="day"><span>18</span></div>
        <div class="day l4"><span>19</span></div>
        <div class="day l3"><span>20</span></div>
        <div class="day l2"><span>21</span></div>
        <div class="day l3"><span>22</span></div>
        <div class="day l1"><span>23</span></div>
        <div class="day"><span>24</span></div>
        <div class="day l2"><span>25</span></div>
        <div class="day l3"><span>26</span></div>
        <div class="day l4"><span>27</span></div>
        <div class="day l2"><span>28</span></div>
        <div class="day l1"><span>29</span></div>
        <div class="day l3"><span>30</span></div>
      </div>
      <div class="legend">少ない
        <div class="sw" style="background:var(--surface2)"></div>
        <div class="sw" style="background:var(--l1)"></div>
        <div class="sw" style="background:var(--l2)"></div>
        <div class="sw" style="background:var(--l3)"></div>
        <div class="sw" style="background:var(--gold)"></div>
      多い</div>
    </div>
    <div class="stats">
      <div class="stat">
        <div class="statval"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3-3 4-3 8a5 5 0 0 0 10 0c0-2-1-3-2-4 .5 2-1 3-2 2 1-3-1-4-3-6z"/></svg>18日</div>
        <div class="statlabel">現在の最長ストリーク</div>
      </div>
      <div class="stat">
        <div class="statval">82%</div>
        <div class="statlabel">今月の達成率</div>
      </div>
    </div>
  </div>
  <div class="navbar">
    <div class="navitem"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1.8"/><path d="M10 6h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="3" y="10" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1.8"/><path d="M10 12h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="3" y="16" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1.8"/><path d="M10 18h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>ホーム</div>
    <div class="navitem active"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3 9h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>カレンダー</div>
    <div class="navitem"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="9" r="6" stroke="currentColor" stroke-width="1.8"/><path d="M9 14.5L7 21l5-3 5 3-2-6.5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>バッジ</div>
    <div class="navitem"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>設定</div>
  </div>
</div>
</x-dc>
</body>
</html>
