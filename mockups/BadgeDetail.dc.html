<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
  :root{
    --bg:#0d1526; --surface:#16233d; --surface2:#1f3357;
    --border:rgba(255,255,255,0.09); --gold:#c9a24b; --gold-bright:#e8c874;
    --text:#f5f1e6; --text-dim:#94a2ba;
  }
  body{margin:0;background:var(--bg);font-family:'Zen Kaku Gothic New',sans-serif;color:var(--text);}
  .serif{font-family:'Shippori Mincho',serif;}
  .frame{width:390px;height:844px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:var(--bg);}
  .content{flex:1;overflow:hidden;padding:52px 24px 0;display:flex;flex-direction:column;gap:26px;}
  .header{display:flex;align-items:center;gap:14px;}
  .backbtn{width:32px;height:32px;border-radius:8px;background:var(--surface);display:flex;align-items:center;justify-content:center;flex:none;}
  .backbtn svg{width:16px;height:16px;color:var(--text);}
  .htitle{font-size:16px;font-weight:800;color:var(--text-dim);}
  .hero{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .ringwrap{position:relative;width:132px;height:132px;display:flex;align-items:center;justify-content:center;}
  .ringwrap svg.ring{position:absolute;inset:0;transform:rotate(-90deg);}
  .ringtrack{stroke:var(--surface2);}
  .ringfill{stroke:var(--gold);stroke-linecap:round;}
  .badgecore{width:88px;height:88px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;}
  .badgecore svg{width:40px;height:40px;color:var(--text-dim);}
  .bname{font-size:20px;font-weight:800;text-align:center;}
  .bcat{font-size:10px;letter-spacing:0.12em;color:var(--gold);font-weight:700;background:var(--gold-soft, rgba(201,162,75,0.14));padding:4px 10px;border-radius:999px;}
  .bdesc{font-size:13px;color:var(--text-dim);text-align:center;line-height:1.7;max-width:280px;}
  .progresscard{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;}
  .progresshead{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;}
  .progresshead b{color:var(--gold-bright);font-size:15px;}
  .track{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;}
  .fill{height:100%;background:var(--gold);border-radius:4px;}
  .progressnote{font-size:11.5px;color:var(--text-dim);text-align:center;}
  .roadmap{display:flex;flex-direction:column;gap:12px;}
  .roadmaplabel{font-size:11px;letter-spacing:0.1em;color:var(--text-dim);font-weight:700;}
  .nodes{display:flex;align-items:center;}
  .node{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;flex:1;}
  .nodecircle{width:36px;height:36px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;position:relative;z-index:1;}
  .nodecircle.current{background:var(--surface2);box-shadow:0 0 0 2px var(--gold);}
  .nodecircle svg{width:17px;height:17px;color:var(--bg);}
  .nodecircle.current svg{color:var(--gold-bright);}
  .nodelabel{font-size:10px;color:var(--text-dim);}
  .nodelabel.current{color:var(--gold-bright);font-weight:700;}
  .connector{position:absolute;top:18px;left:50%;width:100%;height:2px;background:var(--gold);z-index:0;}
  .connector.dim{background:var(--surface2);}
  .check{position:absolute;bottom:-2px;right:-2px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;}
  .check svg{width:8px;height:8px;color:var(--gold);}
</style>
</helmet>
<div class="frame">
  <div class="content">
    <div class="header">
      <div class="backbtn"><svg viewBox="0 0 24 24" fill="none"><path d="M19 12H5M11 5l-6 7 6 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="htitle">バッジ詳細</div>
    </div>
    <div class="hero">
      <div class="ringwrap">
        <svg class="ring" viewBox="0 0 100 100">
          <circle class="ringtrack" cx="50" cy="50" r="42" stroke-width="6" fill="none"/>
          <circle class="ringfill" cx="50" cy="50" r="42" stroke-width="6" fill="none" stroke-dasharray="263.9" stroke-dashoffset="105.6"/>
        </svg>
        <div class="badgecore"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3-3 4-3 8a5 5 0 0 0 10 0c0-2-1-3-2-4 .5 2-1 3-2 2 1-3-1-4-3-6z"/></svg></div>
      </div>
      <div class="bname serif">継続の炎</div>
      <div class="bcat">ストリーク系</div>
      <div class="bdesc">習慣を30日間、一日も欠かさず連続で達成すると解放されます。</div>
    </div>
    <div class="progresscard">
      <div class="progresshead"><span>現在の連続日数</span><b>18 / 30日</b></div>
      <div class="track"><div class="fill" style="width:60%"></div></div>
      <div class="progressnote">あと12日でこのバッジが解放されます</div>
    </div>
    <div class="roadmap">
      <div class="roadmaplabel">ストリークの道のり</div>
      <div class="nodes">
        <div class="node">
          <div class="connector"></div>
          <div class="nodecircle"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3-3 4-3 8a5 5 0 0 0 10 0c0-2-1-3-2-4 .5 2-1 3-2 2 1-3-1-4-3-6z"/></svg><div class="check"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
          <div class="nodelabel">3日</div>
        </div>
        <div class="node">
          <div class="connector"></div>
          <div class="nodecircle"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3-3 4-3 8a5 5 0 0 0 10 0c0-2-1-3-2-4 .5 2-1 3-2 2 1-3-1-4-3-6z"/></svg><div class="check"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
          <div class="nodelabel">7日</div>
        </div>
        <div class="node">
          <div class="connector dim" style="width:0;"></div>
          <div class="nodecircle current"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3-3 4-3 8a5 5 0 0 0 10 0c0-2-1-3-2-4 .5 2-1 3-2 2 1-3-1-4-3-6z"/></svg></div>
          <div class="nodelabel current">30日</div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
