<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
  :root{
    --bg:#0d1526; --surface:#16233d; --surface2:#1f3357;
    --border:rgba(255,255,255,0.09); --gold:#c9a24b; --gold-bright:#e8c874;
    --text:#f5f1e6; --text-dim:#94a2ba;
    --bronze:#b8763c; --bronze-bright:#d99a5f; --silver:#b9c3ce; --silver-bright:#dbe1e7;
  }
  body{margin:0;background:var(--bg);font-family:'Zen Kaku Gothic New',sans-serif;color:var(--text);}
  .serif{font-family:'Shippori Mincho',serif;}
  .frame{width:390px;height:844px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:var(--bg);}
  .content{flex:1;overflow:hidden;padding:52px 20px 0;display:flex;flex-direction:column;gap:18px;}
  .htitle{font-size:19px;font-weight:800;}
  .summary{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;}
  .sumrow{display:flex;justify-content:space-between;align-items:baseline;}
  .sumcount{font-size:20px;font-weight:800;color:var(--gold-bright);}
  .sumlabel{font-size:11px;color:var(--text-dim);}
  .track{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;}
  .fill{height:100%;background:var(--gold);border-radius:3px;}
  .catlabel{font-size:10px;letter-spacing:0.12em;color:var(--text-dim);font-weight:700;padding-top:2px;}
  .grid{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px;}
  .tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 10px;text-align:center;}
  .tile.locked{opacity:0.42;}
  .bicon{width:50px;height:50px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;position:relative;}
  .bicon.locked{background:var(--surface2);}
  .bicon.bronze{background:var(--bronze);}
  .bicon.silver{background:var(--silver);}
  .bicon.gold-ring{box-shadow:0 0 0 3px rgba(232,200,116,0.35);}
  .bicon svg{width:24px;height:24px;color:var(--bg);}
  .bicon.silver svg{color:#1c2433;}
  .bicon.locked svg{color:var(--text-dim);}
  .count{position:absolute;bottom:-3px;right:-3px;background:var(--bg);border:2px solid var(--surface);border-radius:999px;min-width:18px;height:18px;font-size:9px;font-weight:800;color:var(--gold-bright);display:flex;align-items:center;justify-content:center;padding:0 4px;}
  .tile.locked .count{color:var(--text-dim);}
  .btitle{font-size:12px;font-weight:700;}
  .bdate{font-size:9.5px;color:var(--text-dim);}
  .scrollarea{overflow-y:auto;padding-bottom:100px;display:flex;flex-direction:column;gap:16px;}
  .capstone{position:relative;overflow:hidden;border-radius:16px;padding:20px 18px;display:flex;align-items:center;gap:16px;background:radial-gradient(120% 160% at 15% 0%, rgba(232,200,116,0.22), transparent 60%), var(--surface);border:1px solid var(--gold);}
  .capicon{width:56px;height:56px;border-radius:50%;background:linear-gradient(160deg,var(--gold-bright),var(--gold));display:flex;align-items:center;justify-content:center;flex:none;opacity:0.5;}
  .capicon svg{width:28px;height:28px;color:var(--bg);}
  .capmid{display:flex;flex-direction:column;gap:3px;}
  .captitle{font-size:14px;font-weight:800;}
  .capdesc{font-size:11px;color:var(--text-dim);}
  .navbar{height:76px;flex:none;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;}
  .navitem{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text-dim);font-size:10px;}
  .navitem svg{width:20px;height:20px;}
  .navitem.active{color:var(--gold);}
</style>
</helmet>
<div class="frame">
  <div class="content">
    <div class="htitle serif">実績・バッジ</div>
    <div class="summary">
      <div class="sumrow"><div class="sumcount">6 / 9</div><div class="sumlabel">バッジ獲得</div></div>
      <div class="track"><div class="fill" style="width:67%"></div></div>
    </div>
    <div class="scrollarea">
      <div>
        <div class="catlabel">ストリーク</div>
        <div class="grid" style="margin-top:10px;">
          <div class="tile">
            <div class="bicon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3-3 4-3 8a5 5 0 0 0 10 0c0-2-1-3-2-4 .5 2-1 3-2 2 1-3-1-4-3-6z"/></svg><div class="count">3</div></div>
            <div class="btitle">三日坊主卒業</div><div class="bdate">8月5日 獲得</div>
          </div>
          <div class="tile">
            <div class="bicon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3-3 4-3 8a5 5 0 0 0 10 0c0-2-1-3-2-4 .5 2-1 3-2 2 1-3-1-4-3-6z"/></svg><div class="count">7</div></div>
            <div class="btitle">一週間の壁</div><div class="bdate">8月9日 獲得</div>
          </div>
          <div class="tile locked">
            <div class="bicon locked"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3-3 4-3 8a5 5 0 0 0 10 0c0-2-1-3-2-4 .5 2-1 3-2 2 1-3-1-4-3-6z"/></svg><div class="count">30</div></div>
            <div class="btitle">継続の炎</div><div class="bdate">未獲得（18/30日）</div>
          </div>
        </div>
      </div>
      <div>
        <div class="catlabel">コース達成</div>
        <div class="grid" style="margin-top:10px;">
          <div class="tile">
            <div class="bicon bronze"><svg viewBox="0 0 24 24" fill="none"><path d="M12 21V9M12 9C8 9 6 6 6 3c4 0 6 3 6 6zm0 0c0-3 2-6 6-6 0 3-2 6-6 6z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></div>
            <div class="btitle">習慣の芽（21日）</div><div class="bdate">8月23日 獲得</div>
          </div>
          <div class="tile">
            <div class="bicon silver"><svg viewBox="0 0 24 24" fill="none"><path d="M12 15v6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M12 15c-4 0-6-2.5-6-5.5S8 4 12 4s6 2.5 6 5.5S16 15 12 15z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></div>
            <div class="btitle">継続は力なり（90日）</div><div class="bdate">9月5日 獲得</div>
          </div>
          <div class="tile locked">
            <div class="bicon locked gold-ring"><svg viewBox="0 0 24 24" fill="none"><path d="M4 18h16l-1.4-8-4.1 3.2L12 7l-2.5 6.2L5.4 10 4 18z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M4 20h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div>
            <div class="btitle">マスター（180日）</div><div class="bdate">未獲得</div>
          </div>
        </div>
      </div>
      <div>
        <div class="catlabel">行動</div>
        <div class="grid" style="margin-top:10px;">
          <div class="tile">
            <div class="bicon"><svg viewBox="0 0 24 24" fill="none"><path d="M6 3v18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M6 4h11l-2.5 3.5L17 11H6" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></div>
            <div class="btitle">はじめの一歩</div><div class="bdate">8月2日 獲得</div>
          </div>
          <div class="tile">
            <div class="bicon"><svg viewBox="0 0 24 24" fill="none"><path d="M5 3v18M19 3v18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M5 4h6.5l-1.6 2.5L11.5 9H5" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M19 4h-6.5l1.6 2.5L12.5 9H19" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></div>
            <div class="btitle">二刀流</div><div class="bdate">9月1日 獲得</div>
          </div>
        </div>
      </div>
      <div>
        <div class="catlabel">コンプリート</div>
        <div class="capstone" style="margin-top:10px;">
          <div class="capicon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
              <path d="M9 5c-2 1-3 3-3 5"/><path d="M8 9c-2 1-3 3-3 5"/><path d="M8 13c-1.5 1.2-2.5 3-2.5 5"/>
              <path d="M15 5c2 1 3 3 3 5"/><path d="M16 9c2 1 3 3 3 5"/><path d="M16 13c1.5 1.2 2.5 3 2.5 5"/>
            </svg>
          </div>
          <div class="capmid">
            <div class="captitle">パーフェクト</div>
            <div class="capdesc">登録した習慣をすべて習慣化すると解放される特別な実績</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="navbar">
    <div class="navitem"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1.8"/><path d="M10 6h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="3" y="10" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1.8"/><path d="M10 12h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="3" y="16" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1.8"/><path d="M10 18h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>ホーム</div>
    <div class="navitem"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3 9h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>カレンダー</div>
    <div class="navitem active"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="9" r="6" stroke="currentColor" stroke-width="1.8"/><path d="M9 14.5L7 21l5-3 5 3-2-6.5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>バッジ</div>
    <div class="navitem"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>設定</div>
  </div>
</div>
</x-dc>
</body>
</html>
